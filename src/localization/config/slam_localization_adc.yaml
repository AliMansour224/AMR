slam_toolbox:
  ros__parameters:
    use_sim_time: true

    mode: localization

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan_localization

    publish_tf: true
    publish_map: false

    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    map_update_interval: 2.0
    enable_interactive_mode: false

    throttle_scans: 1
    scan_queue_size: 10

    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    map_file_name: /home/ahmed/colcon_ws/src/localization/maps/adc_track_v1_posegraph