safety_supervisor:
  ros__parameters:
    cmd_in_topic: /cmd_vel_smoothed
    cmd_out_topic: /cmd_vel
    scan_topic: /scan
    odom_topic: /odometry/filtered
    scan_timeout_sec: 0.5
    odom_timeout_sec: 0.5
    publish_rate_hz: 20.0
    use_sim_time: true
    force_scan_fail: false
    force_odom_fail: false