velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.6, 0.0, 0.8]
    min_velocity: [0.0, 0.0, -0.8]

    max_accel: [0.8, 0.0, 1.0]
    max_decel: [-0.8, 0.0, -1.0]

    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0